<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Pro</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .topbar {
      height: 64px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .settings-button {
      position: absolute;
      right: 14px;
      top: 12px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #111827;
      font-size: 21px;
      cursor: pointer;
    }

    [dir="rtl"] .settings-button {
      right: auto;
      left: 14px;
    }

    .page {
      display: none;
      max-width: 520px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .page-title {
      text-align: center;
      margin: 5px 0 22px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .camera-box {
      margin-top: 8px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    video {
      width: 100%;
      max-height: 260px;
      border-radius: 12px;
      background: black;
      display: none;
    }

    .preview {
      width: 100%;
      max-height: 230px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
    }

    .camera-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
      flex: 1;
    }

    .danger {
      background: #dc2626;
      color: white;
      width: 100%;
    }

    .next-area {
      margin-top: 20px;
    }

    .back-button {
      background: #e5e7eb;
      width: 100%;
      margin-bottom: 10px;
    }

    .qr-card {
      text-align: center;
      padding: 30px 20px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px auto;
      min-height: 260px;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 260px;
      height: auto;
      padding: 10px;
      background: white;
      border-radius: 10px;
    }

    .store-preview-name {
      font-size: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    .success-message {
      display: none;
      margin: 12px 0;
      padding: 12px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
    }

    .scan-area {
      margin-top: 8px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 12px;
    }

    #barcodeVideo {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      background: black;
      display: none;
    }

    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 15px;
      overflow-y: auto;
    }

    .settings-panel {
      background: white;
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      border-radius: 18px;
      padding: 20px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .settings-header h2 {
      margin: 0;
    }

    .close-settings {
      background: #e5e7eb;
      width: 42px;
      height: 42px;
      padding: 0;
      font-size: 20px;
    }

    .setting-item {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      background: #f3f4f6;
      border-radius: 12px;
      text-align: start;
      font-weight: bold;
    }

    .settings-section {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .settings-section.active {
      display: block;
    }

    .language-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .language-buttons button {
      flex: 1;
    }

    .product-list {
      margin-top: 10px;
    }

    .product-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-info {
      min-width: 0;
    }

    .product-name {
      font-weight: bold;
      word-break: break-word;
    }

    .product-price {
      color: #2563eb;
      margin-top: 4px;
    }

    .edit-product {
      background: #2563eb;
      color: white;
      padding: 9px 12px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 15px;
    }

    .social-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .small-note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 18px 12px 35px;
      }

      .card {
        padding: 18px;
      }

      .page-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <h1>Shop Pro</h1>
    <button class="settings-button" onclick="openSettings()">⚙️</button>
  </header>

  <!-- PAGE 1 -->
  <section id="page1" class="page active">
    <div class="card">

      <h2 class="page-title" data-i18n="storeInfo">Informations du magasin</h2>
      <p class="subtitle" data-i18n="storeSubtitle">
        Créez votre profil de magasin
      </p>

      <label data-i18n="storeName">Nom du magasin</label>
      <input id="storeName" type="text" placeholder="Nom du magasin">

      <label data-i18n="phone">Téléphone</label>
      <input id="storePhone" type="tel" placeholder="Téléphone">

      <label data-i18n="storePhoto">Photo du magasin</label>

      <div class="camera-box">
        <video id="storeVideo" autoplay playsinline></video>

        <img id="storePreview" class="preview">

        <div class="camera-buttons">
          <button class="secondary" onclick="startStoreCamera()" data-i18n="camera">
            📷 Caméra
          </button>

          <button class="secondary" onclick="captureStorePhoto()" data-i18n="capture">
            Capturer
          </button>
        </div>

        <button
          class="secondary"
          style="width:100%;margin-top:8px;"
          onclick="stopStoreCamera()"
          data-i18n="stopCamera">
          Arrêter la caméra
        </button>
      </div>

      <div class="social-row">

        <label>Instagram</label>
        <input id="instagram" type="text" placeholder="Instagram">

        <label>TikTok</label>
        <input id="tiktok" type="text" placeholder="TikTok">

        <label>Facebook</label>
        <input id="facebook" type="text" placeholder="Facebook">

      </div>

      <div class="next-area">
        <button class="primary" onclick="goToPage2()" data-i18n="next">
          Suivant
        </button>
      </div>

    </div>
  </section>


  <!-- PAGE 2 -->
  <section id="page2" class="page">
    <div class="card qr-card">

      <h2 class="page-title" data-i18n="yourQR">
        Votre QR Code
      </h2>

      <p class="subtitle" data-i18n="qrSubtitle">
        Utilisez ce QR Code pour votre magasin
      </p>

      <div class="store-preview-name" id="qrStoreName"></div>

      <div id="qrcode"></div>

      <button class="primary" onclick="downloadQR()" data-i18n="downloadQR">
        Télécharger le QR
      </button>

      <div class="next-area">
        <button class="secondary" onclick="showPage(1)" data-i18n="back">
          Retour
        </button>

        <button class="primary" onclick="goToPage3()" data-i18n="next">
          Suivant
        </button>
      </div>

    </div>
  </section>


  <!-- PAGE 3 -->
  <section id="page3" class="page">
    <div class="card">

      <h2 class="page-title" id="productTitle" data-i18n="newProduct">
        Nouveau produit
      </h2>

      <div id="successMessage" class="success-message"></div>

      <label data-i18n="productName">Nom du produit</label>
      <input id="productName" type="text" placeholder="Nom du produit">

      <label data-i18n="price">Prix</label>
      <input id="productPrice" type="number" min="0" step="0.01" placeholder="Prix">

      <label data-i18n="barcode">Code-barres</label>

      <div class="scan-area">

        <input
          id="productBarcode"
          type="text"
          inputmode="numeric"
          placeholder="Code-barres">

        <video id="barcodeVideo" autoplay playsinline></video>

        <div class="camera-buttons">
          <button class="secondary" onclick="startBarcodeScanner()" data-i18n="scan">
            📷 Scanner
          </button>

          <button class="secondary" onclick="stopBarcodeScanner()" data-i18n="stop">
            Arrêter
          </button>
        </div>

        <div class="small-note" id="barcodeNote"></div>
      </div>

      <label data-i18n="productPhoto">Photo du produit</label>

      <div class="camera-box">

        <video id="productVideo" autoplay playsinline></video>

        <img id="productPreview" class="preview">

        <div class="camera-buttons">

          <button class="secondary" onclick="startProductCamera()" data-i18n="camera">
            📷 Caméra
          </button>

          <button class="secondary" onclick="captureProductPhoto()" data-i18n="capture">
            Capturer
          </button>

        </div>

        <button
          class="secondary"
          style="width:100%;margin-top:8px;"
          onclick="stopProductCamera()"
          data-i18n="stopCamera">
          Arrêter la caméra
        </button>

      </div>

      <div class="next-area">

        <button class="secondary" onclick="showPage(2)" data-i18n="back">
          Retour
        </button>

        <button class="primary" id="saveProductButton" onclick="saveProduct()" data-i18n="save">
          Sauvegarder
        </button>

      </div>

    </div>
  </section>


  <!-- SETTINGS -->
  <div id="settingsOverlay" class="settings-overlay">

    <div class="settings-panel">

      <div class="settings-header">

        <h2 data-i18n="settings">Paramètres</h2>

        <button class="close-settings" onclick="closeSettings()">✕</button>

      </div>


      <button class="setting-item" onclick="toggleSection('languageSection')" data-i18n="language">
        🌐 Langue
      </button>

      <div id="languageSection" class="settings-section">

        <div class="language-buttons">

          <button class="secondary" onclick="setLanguage('fr')">
            Français
          </button>

          <button class="secondary" onclick="setLanguage('ar')">
            العربية
          </button>

        </div>

      </div>


      <button class="setting-item" onclick="toggleSection('profileSection')" data-i18n="profile">
        👤 Profil
      </button>

      <div id="profileSection" class="settings-section">

        <label data-i18n="storeName">Nom du magasin</label>
        <input id="editStoreName" type="text">

        <label data-i18n="phone">Téléphone</label>
        <input id="editStorePhone" type="tel">

        <label>Instagram</label>
        <input id="editInstagram" type="text">

        <label>TikTok</label>
        <input id="editTiktok" type="text">

        <label>Facebook</label>
        <input id="editFacebook" type="text">

        <button
          class="primary"
          style="margin-top:15px;"
          onclick="saveProfile()"
          data-i18n="saveChanges">
          Enregistrer les modifications
        </button>

      </div>


      <button class="setting-item" onclick="toggleSection('productsSection');renderProducts()" data-i18n="products">
        📦 Produits
      </button>

      <div id="productsSection" class="settings-section">

        <div id="productList" class="product-list"></div>

      </div>


      <button class="setting-item" onclick="logout()" data-i18n="logout">
        🚪 Déconnecter
      </button>

    </div>

  </div>


<script>

  /* =========================
     LANGUAGE
  ========================= */

  const translations = {

    fr: {
      storeInfo: "Informations du magasin",
      storeSubtitle: "Créez votre profil de magasin",
      storeName: "Nom du magasin",
      phone: "Téléphone",
      storePhoto: "Photo du magasin",
      camera: "📷 Caméra",
      capture: "Capturer",
      stopCamera: "Arrêter la caméra",
      next: "Suivant",
      back: "Retour",
      yourQR: "Votre QR Code",
      qrSubtitle: "Utilisez ce QR Code pour votre magasin",
      downloadQR: "Télécharger le QR",
      newProduct: "Nouveau produit",
      editProduct: "Modifier le produit",
      productName: "Nom du produit",
      price: "Prix",
      barcode: "Code-barres",
      productPhoto: "Photo du produit",
      scan: "📷 Scanner",
      stop: "Arrêter",
      save: "Sauvegarder",
      update: "Modifier",
      settings: "Paramètres",
      language: "🌐 Langue",
      profile: "👤 Profil",
      products: "📦 Produits",
      logout: "🚪 Déconnecter",
      saveChanges: "Enregistrer les modifications",
      noProducts: "Aucun produit enregistré.",
      saved: "Produit enregistré. Vous pouvez ajouter un nouveau produit.",
      updated: "Produit modifié avec succès.",
      cameraUnsupported: "La caméra n'est pas disponible.",
      barcodeUnsupported: "Le scan automatique n'est pas disponible sur ce navigateur. Entrez le code manuellement."
    },

    ar: {
      storeInfo: "معلومات المتجر",
      storeSubtitle: "أنشئ ملف متجرك",
      storeName: "اسم المتجر",
      phone: "الهاتف",
      storePhoto: "صورة المتجر",
      camera: "📷 الكاميرا",
      capture: "التقاط",
      stopCamera: "إيقاف الكاميرا",
      next: "التالي",
      back: "رجوع",
      yourQR: "رمز QR الخاص بك",
      qrSubtitle: "استعمل هذا الرمز لمتجرك",
      downloadQR: "تحميل QR",
      newProduct: "منتج جديد",
      editProduct: "تعديل المنتج",
      productName: "اسم المنتج",
      price: "السعر",
      barcode: "الباركود",
      productPhoto: "صورة المنتج",
      scan: "📷 مسح",
      stop: "إيقاف",
      save: "حفظ",
      update: "تعديل",
      settings: "الإعدادات",
      language: "🌐 اللغة",
      profile: "👤 الملف الشخصي",
      products: "📦 المنتجات",
      logout: "🚪 تسجيل الخروج",
      saveChanges: "حفظ التعديلات",
      noProducts: "لا توجد منتجات مسجلة.",
      saved: "تم حفظ المنتج. يمكنك إضافة منتج جديد.",
      updated: "تم تعديل المنتج بنجاح.",
      cameraUnsupported: "الكاميرا غير متاحة.",
      barcodeUnsupported: "المسح التلقائي غير متاح في هذا المتصفح. أدخل الباركود يدوياً."
    }

  };

  let currentLanguage = localStorage.getItem("shopProLanguage") || "fr";

  function applyLanguage() {

    document.documentElement.lang = currentLanguage;
    document.documentElement.dir =
      currentLanguage === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-i18n]").forEach(el => {

      const key = el.getAttribute("data-i18n");

      if (translations[currentLanguage][key]) {
        el.textContent = translations[currentLanguage][key];
      }

    });

    updateProductButton();

  }


  function setLanguage(lang) {

    currentLanguage = lang;

    localStorage.setItem(
      "shopProLanguage",
      lang
    );

    applyLanguage();

    renderProducts();

  }


  /* =========================
     DATA
  ========================= */

  let store = JSON.parse(
    localStorage.getItem("shopProStore") || "{}"
  );

  let products = JSON.parse(
    localStorage.getItem("shopProProducts") || "[]"
  );

  let editingProductIndex = -1;


  /* =========================
     PAGES
  ========================= */

  function showPage(number) {

    document.querySelectorAll(".page").forEach(page => {
      page.classList.remove("active");
    });

    document
      .getElementById("page" + number)
      .classList.add("active");

    stopAllCameras();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    if (number === 2) {
      createQR();
    }

  }


  /* =========================
     STORE
  ========================= */

  function saveStoreFromPage() {

    store = {

      name: document.getElementById("storeName").value.trim(),

      phone: document.getElementById("storePhone").value.trim(),

      instagram: document.getElementById("instagram").value.trim(),

      tiktok: document.getElementById("tiktok").value.trim(),

      facebook: document.getElementById("facebook").value.trim(),

      photo:
        document.getElementById("storePreview").src || ""

    };

    localStorage.setItem(
      "shopProStore",
      JSON.stringify(store)
    );

  }


  function loadStore() {

    document.getElementById("storeName").value =
      store.name || "";

    document.getElementById("storePhone").value =
      store.phone || "";

    document.getElementById("instagram").value =
      store.instagram || "";

    document.getElementById("tiktok").value =
      store.tiktok || "";

    document.getElementById("facebook").value =
      store.facebook || "";

    if (store.photo) {

      const preview =
        document.getElementById("storePreview");

      preview.src = store.photo;
      preview.style.display = "block";

    }

  }


  function goToPage2() {

    const name =
      document.getElementById("storeName").value.trim();

    if (!name) {

      alert(
        currentLanguage === "ar"
          ? "أدخل اسم المتجر أولاً."
          : "Entrez d'abord le nom du magasin."
      );

      return;
    }

    saveStoreFromPage();

    createQR();

    showPage(2);

  }


  /* =========================
     STORE CAMERA
  ========================= */

  let storeStream = null;

  async function startStoreCamera() {

    try {

      storeStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

      const video =
        document.getElementById("storeVideo");

      video.srcObject = storeStream;
      video.style.display = "block";

    } catch (error) {

      alert(
        translations[currentLanguage].cameraUnsupported
      );

    }

  }


  function captureStorePhoto() {

    const video =
      document.getElementById("storeVideo");

    if (!storeStream || video.readyState < 2) {

      alert(
        currentLanguage === "ar"
          ? "شغّل الكاميرا أولاً."
          : "Démarrez d'abord la caméra."
      );

      return;

    }

    const canvas =
      document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const image =
      canvas.toDataURL("image/jpeg", 0.85);

    const preview =
      document.getElementById("storePreview");

    preview.src = image;
    preview.style.display = "block";

    stopStoreCamera();

  }


  function stopStoreCamera() {

    if (storeStream) {

      storeStream.getTracks().forEach(track => {
        track.stop();
      });

      storeStream = null;

    }

    const video =
      document.getElementById("storeVideo");

    video.srcObject = null;
    video.style.display = "none";

  }


  /* =========================
     QR
  ========================= */

  function createQR() {

    const container =
      document.getElementById("qrcode");

    container.innerHTML = "";

    const name =
      store.name || "Shop Pro";

    document.getElementById(
      "qrStoreName"
    ).textContent = name;

    const baseUrl =
      window.location.href.split("#")[0];

    const qrData =
      baseUrl +
      "?shop=" +
      encodeURIComponent(name);

    new QRCode(container, {

      text: qrData,

      width: 250,

      height: 250,

      correctLevel: QRCode.CorrectLevel.H

    });

  }


  function downloadQR() {

    const canvas =
      document.querySelector("#qrcode canvas");

    const img =
      document.querySelector("#qrcode img");

    let dataUrl = null;

    if (canvas) {
      dataUrl = canvas.toDataURL("image/png");
    }

    else if (img) {
      dataUrl = img.src;
    }

    if (!dataUrl) return;

    const link =
      document.createElement("a");

    link.href = dataUrl;

    link.download =
      "Shop-Pro-QR.png";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  }


  /* =========================
     PRODUCT
  ========================= */

  let productPhotoData = "";

  function goToPage3() {

    clearProductForm();

    showPage(3);

  }


  function clearProductForm() {

    editingProductIndex = -1;

    document.getElementById("productName").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productBarcode").value = "";

    productPhotoData = "";

    const preview =
      document.getElementById("productPreview");

    preview.src = "";
    preview.style.display = "none";

    document.getElementById(
      "productTitle"
    ).textContent =
      translations[currentLanguage].newProduct;

    updateProductButton();

  }


  function updateProductButton() {

    const button =
      document.getElementById("saveProductButton");

    if (!button) return;

    if (editingProductIndex >= 0) {

      button.textContent =
        translations[currentLanguage].update;

    } else {

      button.textContent =
        translations[currentLanguage].save;

    }

  }


  /* =========================
     PRODUCT CAMERA
  ========================= */

  let productStream = null;

  async function startProductCamera() {

    try {

      productStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment"
          },
          audio: false
        });

      const video =
        document.getElementById("productVideo");

      video.srcObject = productStream;
      video.style.display = "block";

    } catch (error) {

      alert(
        translations[currentLanguage].cameraUnsupported
      );

    }

  }


  function captureProductPhoto() {

    const video =
      document.getElementById("productVideo");

    if (!productStream || video.readyState < 2) {

      alert(
        currentLanguage === "ar"
          ? "شغّل الكاميرا أولاً."
          : "Démarrez d'abord la caméra."
      );

      return;

    }

    const canvas =
      document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    productPhotoData =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );

    const preview =
      document.getElementById("productPreview");

    preview.src = productPhotoData;
    preview.style.display = "block";

    stopProductCamera();

  }


  function stopProductCamera() {

    if (productStream) {

      productStream.getTracks().forEach(track => {
        track.stop();
      });

      productStream = null;

    }

    const video =
      document.getElementById("productVideo");

    video.srcObject = null;
    video.style.display = "none";

  }


  /* =========================
     BARCODE SCANNER
  ========================= */

  let barcodeStream = null;
  let barcodeDetector = null;
  let barcodeScanning = false;

  async function startBarcodeScanner() {

    const video =
      document.getElementById("barcodeVideo");

    const note =
      document.getElementById("barcodeNote");

    try {

      barcodeStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });

      video.srcObject = barcodeStream;
      video.style.display = "block";

      if ("BarcodeDetector" in window) {

        try {

          barcodeDetector =
            new BarcodeDetector({

              formats: [
                "ean_13",
                "ean_8",
                "upc_a",
                "upc_e",
                "code_128",
                "code_39",
                "itf",
                "codabar"
              ]

            });

        } catch (e) {

          barcodeDetector =
            new BarcodeDetector();

        }

        barcodeScanning = true;

        scanBarcode();

      } else {

        note.textContent =
          translations[currentLanguage]
            .barcodeUnsupported;

      }

    } catch (error) {

      alert(
        translations[currentLanguage]
          .cameraUnsupported
      );

    }

  }


  async function scanBarcode() {

    if (!barcodeScanning ||
        !barcodeDetector ||
        !barcodeStream) {

      return;

    }

    const video =
      document.getElementById("barcodeVideo");

    try {

      if (video.readyState >= 2) {

        const results =
          await barcodeDetector.detect(video);

        if (results.length > 0) {

          document.getElementById(
            "productBarcode"
          ).value = results[0].rawValue;

          stopBarcodeScanner();

          return;

        }

      }

    } catch (error) {
      // Continue scanning
    }

    requestAnimationFrame(
      scanBarcode
    );

  }


  function stopBarcodeScanner() {

    barcodeScanning = false;

    if (barcodeStream) {

      barcodeStream
        .getTracks()
        .forEach(track => track.stop());

      barcodeStream = null;

    }

    const video =
      document.getElementById("barcodeVideo");

    video.srcObject = null;
    video.style.display = "none";

  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  function saveProduct() {

    const name =
      document.getElementById(
        "productName"
      ).value.trim();

    const price =
      document.getElementById(
        "productPrice"
      ).value.trim();

    const barcode =
      document.getElementById(
        "productBarcode"
      ).value.trim();

    if (!name) {

      alert(
        currentLanguage === "ar"
          ? "أدخل اسم المنتج."
          : "Entrez le nom du produit."
      );

      return;

    }

    if (!price) {

      alert(
        currentLanguage === "ar"
          ? "أدخل السعر."
          : "Entrez le prix."
      );

      return;

    }

    const product = {

      name: name,

      price: price,

      barcode: barcode,

      photo: productPhotoData || ""

    };


    if (editingProductIndex >= 0) {

      products[editingProductIndex] =
        product;

      localStorage.setItem(
        "shopProProducts",
        JSON.stringify(products)
      );

      showSuccess(
        translations[currentLanguage].updated
      );

      clearProductForm();

    } else {

      products.push(product);

      localStorage.setItem(
        "shopProProducts",
        JSON.stringify(products)
      );

      showSuccess(
        translations[currentLanguage].saved
      );

      clearProductForm();

    }

  }


  function showSuccess(message) {

    const box =
      document.getElementById(
        "successMessage"
      );

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {

      box.style.display = "none";

    }, 3000);

  }


  /* =========================
     SETTINGS
  ========================= */

  function openSettings() {

    document.getElementById(
      "settingsOverlay"
    ).style.display = "block";

    loadProfileEditor();

  }


  function closeSettings() {

    document.getElementById(
      "settingsOverlay"
    ).style.display = "none";

  }


  function toggleSection(id) {

    const section =
      document.getElementById(id);

    const wasActive =
      section.classList.contains("active");

    document
      .querySelectorAll(".settings-section")
      .forEach(s => {
        s.classList.remove("active");
      });

    if (!wasActive) {
      section.classList.add("active");
    }

  }


  /* =========================
     PROFILE EDIT
  ========================= */

  function loadProfileEditor() {

    document.getElementById(
      "editStoreName"
    ).value = store.name || "";

    document.getElementById(
      "editStorePhone"
    ).value = store.phone || "";

    document.getElementById(
      "editInstagram"
    ).value = store.instagram || "";

    document.getElementById(
      "editTiktok"
    ).value = store.tiktok || "";

    document.getElementById(
      "editFacebook"
    ).value = store.facebook || "";

  }


  function saveProfile() {

    store.name =
      document.getElementById(
        "editStoreName"
      ).value.trim();

    store.phone =
      document.getElementById(
        "editStorePhone"
      ).value.trim();

    store.instagram =
      document.getElementById(
        "editInstagram"
      ).value.trim();

    store.tiktok =
      document.getElementById(
        "editTiktok"
      ).value.trim();

    store.facebook =
      document.getElementById(
        "editFacebook"
      ).value.trim();

    localStorage.setItem(
      "shopProStore",
      JSON.stringify(store)
    );

    loadStore();

    createQR();

    alert(
      currentLanguage === "ar"
        ? "تم حفظ معلومات المتجر."
        : "Les informations du magasin ont été enregistrées."
    );

  }


  /* =========================
     PRODUCTS LIST
  ========================= */

  function renderProducts() {

    const list =
      document.getElementById(
        "productList"
      );

    if (!products.length) {

      list.innerHTML =
        `<div class="empty">
          ${translations[currentLanguage].noProducts}
        </div>`;

      return;

    }

    const sorted =
      products
        .map((product, index) => ({
          ...product,
          originalIndex: index
        }))
        .sort((a, b) =>
          a.name.localeCompare(
            b.name,
            currentLanguage === "ar"
              ? "ar"
              : "fr",
            {
              sensitivity: "base"
            }
          )
        );

    list.innerHTML = "";

    sorted.forEach(product => {

      const item =
        document.createElement("div");

      item.className =
        "product-item";

      const info =
        document.createElement("div");

      info.className =
        "product-info";

      const name =
        document.createElement("div");

      name.className =
        "product-name";

      name.textContent =
        product.name;

      const price =
        document.createElement("div");

      price.className =
        "product-price";

      price.textContent =
        product.price;

      info.appendChild(name);
      info.appendChild(price);

      const edit =
        document.createElement("button");

      edit.className =
        "edit-product";

      edit.textContent =
        currentLanguage === "ar"
          ? "تعديل"
          : "Modifier";

      edit.onclick = function() {

        editProduct(
          product.originalIndex
        );

      };

      item.appendChild(info);
      item.appendChild(edit);

      list.appendChild(item);

    });

  }


  function editProduct(index) {

    const product =
      products[index];

    if (!product) return;

    editingProductIndex =
      index;

    document.getElementById(
      "productName"
    ).value =
      product.name || "";

    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";

    document.getElementById(
      "productBarcode"
    ).value =
      product.barcode || "";

    productPhotoData =
      product.photo || "";

    const preview =
      document.getElementById(
        "productPreview"
      );

    if (product.photo) {

      preview.src =
        product.photo;

      preview.style.display =
        "block";

    } else {

      preview.src = "";

      preview.style.display =
        "none";

    }

    document.getElementById(
      "productTitle"
    ).textContent =
      translations[currentLanguage]
        .editProduct;

    updateProductButton();

    closeSettings();

    showPage(3);

  }


  /* =========================
     LOGOUT
  ========================= */

  function logout() {

    closeSettings();

    showPage(1);

    alert(
      currentLanguage === "ar"
        ? "تم تسجيل الخروج."
        : "Vous êtes déconnecté."
    );

  }


  /* =========================
     STOP ALL CAMERAS
  ========================= */

  function stopAllCameras() {

    stopStoreCamera();
    stopProductCamera();
    stopBarcodeScanner();

  }


  /* =========================
     INITIALIZE
  ========================= */

  applyLanguage();

  loadStore();

</script>
