<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #6b7280;
    }

    button.danger {
      background: #dc2626;
    }

    button.success {
      background: #16a34a;
    }

    .hidden {
      display: none !important;
    }

    img.preview {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
      background: #eee;
    }

    video {
      width: 100%;
      max-height: 350px;
      background: black;
      border-radius: 12px;
      margin-top: 14px;
      display: none;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .product-box {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product-box img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      display: none;
    }

    #qrcode {
      text-align: center;
      margin-top: 15px;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  Shop Pro
</header>

<div class="container">

  <!-- =========================
       PAGE 1 - STORE
  ========================== -->

  <section id="page1" class="page active">

    <div class="card">

      <h2>Informations du magasin</h2>

      <label>Nom du magasin</label>
      <input
        id="storeName"
        type="text"
        placeholder="Nom du magasin"
      >

      <label>Téléphone</label>
      <input
        id="storePhone"
        type="tel"
        placeholder="Téléphone"
      >

      <label>Instagram</label>
      <input
        id="instagram"
        type="text"
        placeholder="@instagram"
      >

      <label>TikTok</label>
      <input
        id="tiktok"
        type="text"
        placeholder="@tiktok"
      >

      <label>Photo du magasin</label>

      <button onclick="startStoreCamera()">
        📷 Prendre une photo
      </button>

      <video
        id="storeVideo"
        autoplay
        playsinline
      ></video>

      <button
        id="captureStore"
        class="success hidden"
        onclick="captureStorePhoto()"
      >
        📸 Capturer
      </button>

      <button
        id="stopStoreCamera"
        class="secondary hidden"
        onclick="stopStoreCamera()"
      >
        Arrêter la caméra
      </button>

      <img
        id="storePhotoPreview"
        class="preview"
        alt="Photo du magasin"
      >

      <button
        id="removeStorePhoto"
        class="danger hidden"
        onclick="removeStorePhoto()"
      >
        ✕ Supprimer la photo
      </button>

    </div>

    <div class="nav-buttons">

      <button onclick="saveStore()">
        Enregistrer
      </button>

      <button onclick="nextPage(2)">
        Next →
      </button>

    </div>

  </section>


  <!-- =========================
       PAGE 2 - PRODUCT
  ========================== -->

  <section id="page2" class="page">

    <div class="card">

      <h2>Nouveau produit</h2>

      <label>Nom du produit</label>

      <input
        id="productName"
        type="text"
        placeholder="Nom du produit"
      >

      <label>Prix (DA)</label>

      <input
        id="productPrice"
        type="number"
        placeholder="Prix"
      >

      <label>Code-barres</label>

      <input
        id="productBarcode"
        type="text"
        placeholder="Scanner ou saisir le code"
      >

      <button onclick="startBarcodeCamera()">
        📷 Scanner le code-barres
      </button>

      <video
        id="barcodeVideo"
        autoplay
        playsinline
      ></video>

      <button
        id="stopBarcode"
        class="secondary hidden"
        onclick="stopBarcodeCamera()"
      >
        Arrêter la caméra
      </button>

      <p class="small">
        Si votre navigateur ne reconnaît pas automatiquement
        le code-barres, vous pouvez saisir le numéro manuellement.
      </p>

      <label>Photo du produit</label>

      <button onclick="startProductCamera()">
        📷 Prendre une photo
      </button>

      <video
        id="productVideo"
        autoplay
        playsinline
      ></video>

      <button
        id="captureProduct"
        class="success hidden"
        onclick="captureProductPhoto()"
      >
        📸 Capturer
      </button>

      <button
        id="stopProductCamera"
        class="secondary hidden"
        onclick="stopProductCamera()"
      >
        Arrêter la caméra
      </button>

      <img
        id="productPhotoPreview"
        class="preview"
        alt="Photo du produit"
      >

      <button
        id="removeProductPhoto"
        class="danger hidden"
        onclick="removeProductPhoto()"
      >
        ✕ Supprimer la photo
      </button>

    </div>

    <div class="nav-buttons">

      <button
        class="secondary"
        onclick="nextPage(1)"
      >
        ← Back
      </button>

      <button
        class="success"
        onclick="saveProduct()"
      >
        Enregistrer le produit
      </button>

    </div>

  </section>


  <!-- =========================
       PAGE 3 - STORE QR
  ========================== -->

  <section id="page3" class="page">

    <div class="card">

      <h2>QR du magasin</h2>

      <p>
        Le client peut scanner ce QR pour ouvrir
        la page du magasin.
      </p>

      <div id="qrcode"></div>

      <button
        class="success"
        onclick="createQR()"
      >
        Générer le QR
      </button>

    </div>

    <button
      class="secondary"
      onclick="nextPage(2)"
    >
      ← Back
    </button>

  </section>


  <!-- =========================
       PAGE 4 - CUSTOMER
  ========================== -->

  <section id="page4" class="page">

    <div class="card">

      <h2 id="customerStoreName">
        Shop Pro
      </h2>

      <p id="customerPhone"></p>

      <p id="customerInstagram"></p>

      <p id="customerTikTok"></p>

    </div>

    <div id="customerProducts"></div>

  </section>

</div>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

  /* =========================
     GLOBAL VARIABLES
  ========================== */

  let currentPage = 1;

  let storeStream = null;
  let productStream = null;
  let barcodeStream = null;

  let storePhotoData = "";
  let productPhotoData = "";

  let products = [];


  /* =========================
     PAGE NAVIGATION
  ========================== */

  function nextPage(pageNumber) {

    document
      .querySelectorAll(".page")
      .forEach(function(page) {
        page.classList.remove("active");
      });

    const target =
      document.getElementById(
        "page" + pageNumber
      );

    if (target) {

      target.classList.add("active");

      currentPage = pageNumber;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  }


  /* =========================
     STORE CAMERA
  ========================== */

  async function startStoreCamera() {

    try {

      stopStoreCamera();

      storeStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      const video =
        document.getElementById(
          "storeVideo"
        );

      video.srcObject = storeStream;

      video.style.display = "block";

      document
        .getElementById("captureStore")
        .classList.remove("hidden");

      document
        .getElementById("stopStoreCamera")
        .classList.remove("hidden");

      await video.play();

    } catch (error) {

      console.error(error);

      alert(
        "Impossible d'ouvrir la caméra. Autorisez l'accès à la caméra."
      );

    }
  }


  function captureStorePhoto() {

    const video =
      document.getElementById(
        "storeVideo"
      );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

    const context =
      canvas.getContext("2d");

    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    storePhotoData =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );

    const image =
      document.getElementById(
        "storePhotoPreview"
      );

    image.src =
      storePhotoData;

    image.style.display =
      "block";

    document
      .getElementById("removeStorePhoto")
      .classList.remove("hidden");

    stopStoreCamera();
  }


  function stopStoreCamera() {

    if (storeStream) {

      storeStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

      storeStream = null;
    }

    const video =
      document.getElementById(
        "storeVideo"
      );

    if (video) {

      video.pause();

      video.srcObject = null;

      video.style.display = "none";
    }

    document
      .getElementById("captureStore")
      .classList.add("hidden");

    document
      .getElementById("stopStoreCamera")
      .classList.add("hidden");
  }


  function removeStorePhoto() {

    storePhotoData = "";

    const image =
      document.getElementById(
        "storePhotoPreview"
      );

    image.src = "";

    image.style.display =
      "none";

    document
      .getElementById("removeStorePhoto")
      .classList.add("hidden");
  }


  /* =========================
     PRODUCT CAMERA
  ========================== */

  async function startProductCamera() {

    try {

      stopProductCamera();

      productStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      const video =
        document.getElementById(
          "productVideo"
        );

      video.srcObject =
        productStream;

      video.style.display =
        "block";

      document
        .getElementById("captureProduct")
        .classList.remove("hidden");

      document
        .getElementById("stopProductCamera")
        .classList.remove("hidden");

      await video.play();

    } catch (error) {

      console.error(error);

      alert(
        "Impossible d'ouvrir la caméra."
      );

    }
  }


  function captureProductPhoto() {

    const video =
      document.getElementById(
        "productVideo"
      );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;

    const context =
      canvas.getContext("2d");

    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    productPhotoData =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );

    const image =
      document.getElementById(
        "productPhotoPreview"
      );

    image.src =
      productPhotoData;

    image.style.display =
      "block";

    document
      .getElementById("removeProductPhoto")
      .classList.remove("hidden");

    stopProductCamera();
  }


  function stopProductCamera() {

    if (productStream) {

      productStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

      productStream = null;
    }

    const video =
      document.getElementById(
        "productVideo"
      );

    if (video) {

      video.pause();

      video.srcObject = null;

      video.style.display = "none";
    }

    document
      .getElementById("captureProduct")
      .classList.add("hidden");

    document
      .getElementById("stopProductCamera")
      .classList.add("hidden");
  }


  function removeProductPhoto() {

    productPhotoData = "";

    const image =
      document.getElementById(
        "productPhotoPreview"
      );

    image.src = "";

    image.style.display =
      "none";

    document
      .getElementById("removeProductPhoto")
      .classList.add("hidden");
  }


  /* =========================
     BARCODE CAMERA
  ========================== */

  async function startBarcodeCamera() {

    try {

      stopBarcodeCamera();

      barcodeStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      const video =
        document.getElementById(
          "barcodeVideo"
        );

      video.srcObject =
        barcodeStream;

      video.style.display =
        "block";

      document
        .getElementById("stopBarcode")
        .classList.remove("hidden");

      await video.play();

      startBarcodeDetection(video);

    } catch (error) {

      console.error(error);

      alert(
        "Impossible d'ouvrir la caméra. Autorisez l'accès à la caméra."
      );
    }
  }


  async function startBarcodeDetection(video) {

    if (
      !("BarcodeDetector" in window)
    ) {

      return;
    }

    let detector;

    try {

      detector =
        new BarcodeDetector({
          formats: [
            "ean_13",
            "ean_8",
            "upc_a",
            "upc_e",
            "code_128",
            "code_39",
            "itf"
          ]
        });

    } catch (error) {

      console.log(error);

      return;
    }


    async function detect() {

      if (
        !barcodeStream ||
        video.readyState < 2
      ) {

        if (barcodeStream) {
          requestAnimationFrame(detect);
        }

        return;
      }

      try {

        const codes =
          await detector.detect(video);

        if (
          codes &&
          codes.length > 0
        ) {

          document
            .getElementById(
              "productBarcode"
            )
            .value =
            codes[0].rawValue;

          stopBarcodeCamera();

          return;
        }

      } catch (error) {

        console.log(
          "Barcode detection:",
          error
        );
      }

      if (barcodeStream) {
        requestAnimationFrame(detect);
      }
    }

    detect();
  }


  function stopBarcodeCamera() {

    if (barcodeStream) {

      barcodeStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

      barcodeStream = null;
    }

    const video =
      document.getElementById(
        "barcodeVideo"
      );

    if (video) {

      video.pause();

      video.srcObject = null;

      video.style.display = "none";
    }

    document
      .getElementById("stopBarcode")
      .classList.add("hidden");
  }


  /* =========================
     STORE SAVE
  ========================== */

  function saveStore() {

    const store = {

      name:
        document.getElementById(
          "storeName"
        ).value,

      phone:
        document.getElementById(
          "storePhone"
        ).value,

      instagram:
        document.getElementById(
          "instagram"
        ).value,

      tiktok:
        document.getElementById(
          "tiktok"
        ).value,

      photo:
        storePhotoData

    };

    localStorage.setItem(
      "shopProStore",
      JSON.stringify(store)
    );

    alert(
      "Informations enregistrées."
    );
  }


  /* =========================
     PRODUCT SAVE
  ========================== */

  function saveProduct() {

    const name =
      document.getElementById(
        "productName"
      ).value.trim();

    const price =
      document.getElementById(
        "productPrice"
      ).value;

    const barcode =
      document.getElementById(
        "productBarcode"
      ).value.trim();

    if (!name) {

      alert(
        "Entrez le nom du produit."
      );

      return;
    }

    if (!price) {

      alert(
        "Entrez le prix."
      );

      return;
    }

    const product = {

      name: name,

      price: price,

      barcode: barcode,

      photo: productPhotoData
    };

    products.push(product);

    localStorage.setItem(
      "shopProProducts",
      JSON.stringify(products)
    );

    alert(
      "Produit enregistré."
    );

    document
      .getElementById(
        "productName"
      ).value = "";

    document
      .getElementById(
        "productPrice"
      ).value = "";

    document
      .getElementById(
        "productBarcode"
      ).value = "";

    removeProductPhoto();

    nextPage(3);

    createQR();
  }


  /* =========================
     QR CODE
  ========================== */

  function createQR() {

    const box =
      document.getElementById(
        "qrcode"
      );

    if (!box) {
      return;
    }

    box.innerHTML = "";

    if (
      typeof QRCode === "undefined"
    ) {

      box.innerHTML =
        "<p>QR library unavailable.</p>";

      return;
    }

    const url =
      window.location.origin +
      window.location.pathname;

    new QRCode(
      box,
      {
        text: url,
        width: 220,
        height: 220
      }
    );
  }


  /* =========================
     LOAD DATA
  ========================== */

  function loadData() {

    const savedStore =
      localStorage.getItem(
        "shopProStore"
      );

    if (savedStore) {

      try {

        const store =
          JSON.parse(savedStore);

        document
          .getElementById(
            "storeName"
          ).value =
          store.name || "";

        document
          .getElementById(
            "storePhone"
          ).value =
          store.phone || "";

        document
          .getElementById(
            "instagram"
          ).value =
          store.instagram || "";

        document
          .getElementById(
            "tiktok"
          ).value =
          store.tiktok || "";

        if (store.photo) {

          storePhotoData =
            store.photo;

          const image =
            document.getElementById(
              "storePhotoPreview"
            );

          image.src =
            store.photo;

          image.style.display =
            "block";

          document
            .getElementById(
              "removeStorePhoto"
            )
            .classList.remove(
              "hidden"
            );
        }

      } catch (error) {

        console.log(error);
      }
    }


    const savedProducts =
      localStorage.getItem(
        "shopProProducts"
      );

    if (savedProducts) {

      try {

        products =
          JSON.parse(
            savedProducts
          );

      } catch (error) {

        products = [];
      }
    }
  }


  /* =========================
     START
  ========================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadData();

      nextPage(1);

    }
  );

</script>

</body>
</html>
