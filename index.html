<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Pro</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.page{
  display:none;
  max-width:600px;
  margin:auto;
  padding:25px 18px;
}
.page.active{display:block}
h2{text-align:center}
input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#111827;
  color:white;
  border:0;
  font-weight:bold;
}
button.secondary{
  background:#e5e7eb;
  color:#111827;
}
.card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin:12px 0;
  box-shadow:0 2px 8px #0001;
}
.camera-box{
  text-align:center;
  margin:15px 0;
}
.camera-box img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:15px;
  display:none;
  margin:10px auto;
}
#video{
  width:100%;
  max-height:350px;
  border-radius:15px;
  background:#000;
  display:none;
}
.back{
  background:#6b7280;
}
.product{
  display:flex;
  align-items:center;
  gap:15px;
}
.product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}
.price{
  font-weight:bold;
  margin-top:5px;
}
#qr{
  display:flex;
  justify-content:center;
  margin:25px 0;
}
</style>
</head>

<body>

<header>Shop Pro</header>

<!-- PAGE 1 -->
<section id="storePage" class="page active">
  <h2>Create Your Store</h2>

  <input id="storeName" placeholder="Store name">
  <input id="phone" placeholder="Phone number">

  <div class="card camera-box">
    <b>Store Logo / Photo</b>

    <input
      type="file"
      id="storePhoto"
      accept="image/*"
      capture="environment"
    >

    <img id="storePreview">
  </div>

  <input id="facebook" placeholder="Facebook">
  <input id="instagram" placeholder="Instagram">
  <input id="tiktok" placeholder="TikTok">

  <button onclick="createStore()">Next</button>
</section
